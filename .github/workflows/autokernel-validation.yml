name: AutoKernel validation

on:
  push:
    branches:
      - feature/autokernel-stage1
      - 'feature/autokernel-*'
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  test:
    name: Go test and compile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          files=$(gofmt -l internal/model/kernel_selector.go internal/model/kernel_selector_test.go internal/machine/machine.go)
          if [ -n "$files" ]; then echo "$files"; gofmt -d internal/model/kernel_selector.go internal/model/kernel_selector_test.go internal/machine/machine.go; exit 1; fi
      - name: PHP syntax lint (panel integration candidate)
        run: |
          php -v
          find integrations/xboard-idempotent -name '*.php' -print0 |
            xargs -0 -n 1 php -l
      - name: Installer safety tests
        run: |
          bash -n install.sh
          bash tests/installer-safety.sh
      - name: Selector unit tests
        run: go test ./internal/model -run TestResolveKernelForNode -count=1
      - name: Complete test suite
        run: go test -tags "with_quic with_utls with_wireguard with_clash_api" ./...
      - name: Static analysis
        run: go vet -tags "with_quic with_utls with_wireguard with_clash_api" ./...
      - name: Race-sensitive kernel and control-plane tests
        run: go test -race -tags "with_quic with_utls with_wireguard with_clash_api" ./internal/model ./internal/machine ./internal/controlplane ./internal/tracker ./internal/reportjournal ./internal/service ./internal/panel ./internal/kernel/singbox ./internal/kernel/obfs ./internal/monitor
      - name: Naive real client interoperability (test-only build)
        env:
          CGO_ENABLED: "0"
        run: |
          module=github.com/sagernet/cronet-go/lib/linux_amd64
          go mod download "$module"
          libdir=$(go list -m -f '{{.Dir}}' "$module")
          test -f "$libdir/libcronet.so"
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          cp "$libdir/libcronet.so" "$scratch/"
          export LD_LIBRARY_PATH="$scratch"
          go test -c -tags "with_quic with_utls with_wireguard with_clash_api with_naive_outbound with_purego" -o "$scratch/naive.test" ./internal/kernel/singbox
          "$scratch/naive.test" -test.v -test.count=1 -test.timeout=3m -test.run '^TestNaiveClientRoundTrip$'
      - name: Mixed protocol concurrent load (100 to 5000)
        run: |
          ulimit -n 65536
          for n in 100 500 1000 5000; do
            XBOARD_TEST_CONNECTIONS="$n" go test -v -count=1 -timeout 3m -tags "with_quic with_utls with_wireguard with_clash_api" ./internal/kernel/singbox -run '^TestMixedProtocolConcurrentLoad$'
          done
      - name: Build release candidate binaries
        run: |
          make build-linux build-linux-arm64 VERSION=v1.0.0-rc.2-${GITHUB_SHA:0:12}
          mkdir -p dist
          cp xboard-node-linux-amd64 xboard-node-linux-arm64 xbctl-linux-amd64 xbctl-linux-arm64 dist/
          (cd dist && sha256sum xboard-node-linux-* xbctl-linux-* > SHA256SUMS)
      - name: Smoke test native release binaries
        run: |
          ./dist/xboard-node-linux-amd64 --help
          ./dist/xbctl-linux-amd64 --help
          bash -n install.sh
      - name: Upload release candidate binaries
        uses: actions/upload-artifact@v4
        with:
          name: autokernel-release-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish-rc:
    name: Publish v1.0.0-rc.2 (test only)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/autokernel-stage1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: autokernel-rc-2-publication
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: autokernel-release-candidate
          path: dist
      - name: Verify assets
        run: |
          cd dist
          sha256sum -c SHA256SUMS
      - name: Publish immutable candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v1.0.0-rc.2 >/dev/null 2>&1; then
            echo "RC already exists; refusing to overwrite assets."
            exit 0
          fi
          gh release create v1.0.0-rc.2 dist/* \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Xboard-Node v1.0.0-rc.2" \
            --notes "RC2 test candidate: per-node report logs, raw traffic byte totals, bounded OBFS failure diagnostics and tests. REALITY log filtering deferred to avoid introducing extra kernel services. CI passed; real-client interoperability and production load are not yet certified. Existing panel compatibility retained. Install with explicit --version v1.0.0-rc.2. Back up existing binaries and configuration before testing. Do not switch production-wide installer URLs yet."
