name: AutoKernel validation

on:
  push:
    branches:
      - feature/autokernel-stage1
      - 'feature/autokernel-*'
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  test:
    name: Go test and compile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          files=$(gofmt -l internal/model/kernel_selector.go internal/model/kernel_selector_test.go internal/machine/machine.go)
          if [ -n "$files" ]; then echo "$files"; gofmt -d internal/model/kernel_selector.go internal/model/kernel_selector_test.go internal/machine/machine.go; exit 1; fi
      - name: Selector unit tests
        run: go test ./internal/model -run TestResolveKernelForNode -count=1
      - name: Complete test suite
        run: go test -tags "with_quic with_utls with_wireguard with_clash_api" ./...
      - name: Static analysis
        run: go vet -tags "with_quic with_utls with_wireguard with_clash_api" ./...
      - name: Race-sensitive kernel and control-plane tests
        run: go test -race -tags "with_quic with_utls with_wireguard with_clash_api" ./internal/model ./internal/machine ./internal/controlplane ./internal/tracker ./internal/kernel/singbox
      - name: Compile binaries
        run: |
          go build -tags "with_quic with_utls with_wireguard with_clash_api" -o /tmp/xboard-node-autokernel ./cmd/xboard-node
          go build -o /tmp/xbctl-autokernel ./cmd/xbctl
      - name: Upload isolated test binaries
        uses: actions/upload-artifact@v4
        with:
          name: autokernel-stage1-linux-amd64
          path: |
            /tmp/xboard-node-autokernel
            /tmp/xbctl-autokernel
          retention-days: 7
